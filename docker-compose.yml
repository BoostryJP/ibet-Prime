services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=apluser
      - POSTGRES_PASSWORD=apluserpass
      - POSTGRES_DB=apldb
    tmpfs:
      - /var/lib/postgresql/data
  ibet-anvil-network:
    build:
      context: ./
      dockerfile: tests/Dockerfile_ibet
    ports:
      - "8545:8545"
  eth-anvil-network:
    build:
      context: ./
      dockerfile: tests/Dockerfile_eth
    ports:
      - "8546:8545"
  ava-anvil-network:
    build:
      context: ./
      dockerfile: tests/Dockerfile_ava
    ports:
      - "8547:8545"
  ibet-prime-postgres:
    build:
      context: ./
      dockerfile: ./tests/Dockerfile_unittest
    environment:
      - TEST_DATABASE_URL=postgresql://apluser:apluserpass@postgres/apldb
      - WEB3_HTTP_PROVIDER=http://ibet:8545
      - ETH_WEB3_HTTP_PROVIDER=http://eth:8545
      - ETH_CHAIN_ID=11111
      - AVA_WEB3_HTTP_PROVIDER=http://ava:8545
      - AVA_CHAIN_ID=22222
      - RESPONSE_VALIDATION_MODE=1
      - IBET_WST_ETH_FEATURE_ENABLED=1
      - IBET_WST_AVA_FEATURE_ENABLED=1
      - BC_EXPLORER_ENABLED=1
      - FREEZE_LOG_FEATURE_ENABLED=1
      - DVP_AGENT_FEATURE_ENABLED=1
    links:
      - postgres:postgres
      - ibet-anvil-network:ibet
      - eth-anvil-network:eth
      - ava-anvil-network:ava
    depends_on:
      - postgres
      - ibet-anvil-network
      - eth-anvil-network
      - ava-anvil-network
    volumes:
      - ./cov:/app/ibet-Prime/cov
