<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blockchain Explorer</title>
    <script src="https://unpkg.com/htmx.org@2.0.x"></script>
    <script defer src="https://unpkg.com/alpinejs@3.15.x"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="font-sans antialiased bg-gray-900 text-gray-100 p-4">
    <!-- Inline error alert (hidden by default) -->
    <div id="api-error-alert" class="hidden mb-3 rounded border border-red-600 bg-red-700/40 px-3 py-2 text-sm text-red-100"></div>

    <h1 class="text-xl font-semibold mb-4">ibet Blockchain Explorer</h1>

    <div x-data="explorerComponent()" @select-block.window="handleSelectBlock($event.detail)">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <section>
          <fieldset class="border border-gray-700 rounded-md p-4 bg-gray-800 shadow-sm">
            <legend class="px-2 text-sm text-gray-300">Block search</legend>
            <form class="flex flex-wrap gap-3 items-end"
                  hx-get="/blockchain_explorer/ui/blocks"
                  hx-target="#block-list"
                  hx-push-url="true"
                  hx-trigger="submit"
                  hx-sync="closest form:abort"
                  @submit="clearTxDetail()"
            >
              <label class="flex-1 text-sm">From#
                <input name="from_block_number" type="number" min="0" placeholder="e.g. 0"
                       value="{{ initial_block_query.from_block_number if initial_block_query and initial_block_query.from_block_number is not none }}"
                       class="mt-1 w-full rounded border border-gray-600 bg-gray-900 text-gray-100 placeholder-gray-400 px-2 py-1 text-sm"/>
              </label>
              <label class="flex-1 text-sm">To#
                <input name="to_block_number" type="number" min="0" placeholder="e.g. 100"
                       value="{{ initial_block_query.to_block_number if initial_block_query and initial_block_query.to_block_number is not none }}"
                       class="mt-1 w-full rounded border border-gray-600 bg-gray-900 text-gray-100 placeholder-gray-400 px-2 py-1 text-sm"/>
              </label>
              <label class="w-24 text-sm">Limit
                <input name="limit" type="number" min="1" max="1000" value="{{ initial_block_query.limit if initial_block_query and initial_block_query.limit is not none else 50 }}"
                       class="mt-1 w-full rounded border border-gray-600 bg-gray-900 text-gray-100 placeholder-gray-400 px-2 py-1 text-sm"/>
              </label>
              <label class="w-24 text-sm">Offset
                <input name="offset" type="number" min="0" value="{{ initial_block_query.offset if initial_block_query and initial_block_query.offset is not none else 0 }}"
                       class="mt-1 w-full rounded border border-gray-600 bg-gray-900 text-gray-100 placeholder-gray-400 px-2 py-1 text-sm"/>
              </label>
              <label class="w-28 text-sm">Sort
                <select name="sort_order" class="mt-1 w-full rounded border border-gray-600 bg-gray-900 text-gray-100 px-2 py-1 text-sm">
                  <option value="1" {% if initial_block_query and initial_block_query.sort_order != 0 %}selected{% endif %}>Desc</option>
                  <option value="0" {% if initial_block_query and initial_block_query.sort_order == 0 %}selected{% endif %}>Asc</option>
                </select>
              </label>
              <button type="submit" class="ml-auto inline-flex items-center rounded bg-indigo-600 text-white px-3 py-1.5 text-sm hover:bg-indigo-500">Search</button>
            </form>
            <div id="block-list" class="text-gray-400 text-sm mt-3">Enter conditions and search.</div>
          </fieldset>
          <div id="block-detail" class="mt-3 border border-gray-700 rounded-md p-3 bg-gray-800 shadow-sm text-gray-400 text-sm">Click a block number to display its transactions on the right.</div>
        </section>

        <section>
          <fieldset class="border border-gray-700 rounded-md p-4 bg-gray-800 shadow-sm">
            <legend class="px-2 text-sm text-gray-300">Transactions in selected block <span class="font-mono text-indigo-300" x-text="$store.explorer.selectedBlockNumber ? '#' + $store.explorer.selectedBlockNumber : ''"></span></legend>
            <div id="tx-list" x-ref="txList" class="text-gray-400 text-sm">Select a block number from the left list.</div>
          </fieldset>
          <div id="tx-detail" x-ref="txDetail" class="mt-3 border border-gray-700 rounded-md p-3 bg-gray-800 shadow-sm text-gray-400 text-sm">Transaction detail will appear here.</div>
        </section>
      </div>
    </div>

    <script>
      // Show a simple error message with HTTP status when HTMX requests fail
      document.body.addEventListener('htmx:responseError', function(evt){
        const alertEl = document.getElementById('api-error-alert');
        const xhr = evt.detail?.xhr;
        const status = xhr?.status ?? 'Unknown';
        const statusText = xhr?.statusText ?? '';
        alertEl.textContent = `Request failed: ${status} ${statusText}`;
        alertEl.classList.remove('hidden');
        setTimeout(() => alertEl.classList.add('hidden'), 5000);
      });

      document.addEventListener('alpine:init', () => {
        Alpine.store('explorer', {
          selectedBlockNumber: null,
        });
        Alpine.data('explorerComponent', () => ({
          clearTxDetail(){
            if (this.$refs.txDetail) this.$refs.txDetail.innerHTML = 'Transaction detail will appear here.';
          },
          handleSelectBlock(num){
            Alpine.store('explorer').selectedBlockNumber = num;
            this.clearTxDetail();
            if (this.$refs.txList) this.$refs.txList.innerHTML = 'Loading transactions...';
          },
        }));
      });
    </script>
  </body>
</html>
