  /share/transfer_approvals/{token_address}/{id}:
    post:
      tags:
        - share
      summary: Update Share Token Transfer Approval Status
      description: |-
        Approve or cancel a share-token transfer application.

        A successful response means the approval or cancellation operation is complete.
        Approval targets the transfer mechanism selected by the application's exchange address.

        Authentication accepts a valid EOA password or issuer auth token.
        The application must exist, be unprocessed, and satisfy escrow and cancellation rules.
        Personal information must already be registered for both accounts.

        Errors:
        - 400 `ContractRevertError` (contract-defined code, or code 0): a contract operation reverted.
        - 400 `InvalidParameterError` (code 1): the token is pending, or the application is terminal, duplicate, not ready after escrow, or not cancelable.
        - 400 `OperationNotAllowedStateError` (code 101): personal information is missing for the source or destination.
        - 401 `AuthorizationError` (code 1): the issuer does not exist or neither supplied credential is valid.
        - 404: the token or transfer-approval application does not exist.
        - 422: a path, header, or body parameter is invalid, or an encrypted EOA password cannot be decoded.
        - 503 `SendTransactionError` (code 2): a transaction could not be sent or a non-contract failure occurred.
      operationId: UpdateShareTokenTransferApprovalStatus
      parameters:
        - name: token_address
          in: path
          required: true
          schema:
            type: string
            title: Token Address
        - name: id
          in: path
          required: true
          schema:
            type: integer
            title: Id
        - name: issuer-address
          in: header
          required: true
          schema:
            type: string
            title: Issuer-Address
        - name: eoa-password
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Eoa-Password
        - name: auth-token
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Auth-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransferApprovalRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ContractRevertErrorResponse'
                  - $ref: '#/components/schemas/InvalidParameterErrorResponse'
                  - $ref: '#/components/schemas/OperationNotAllowedStateErrorResponse'
                title: Response 400 Updatesharetokentransferapprovalstatus
        '401':
          description: Authorization Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
