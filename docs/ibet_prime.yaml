          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Eoa-Password
        - name: auth-token
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Auth-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceLockRequest'
