  /bond/transfer_approvals/{token_address}/{id}:
    post:
      tags:
        - bond
      summary: Update Bond Token Transfer Approval Status
      description: |-
        Approve or cancel a bond transfer-approval application.

        The request completes after the requested approval or cancellation succeeds.
        A successful operation makes the application and both counterparties' personal information available in transfer-approval history.

        The application must be actionable, and both counterparties must have issuer personal information registered.
        Escrow-backed approvals require completed escrow; escrow-backed applications cannot be canceled.

        Errors:
        - 400 `ContractRevertError` (code varies): the approval or cancellation contract call reverts.
        - 400 `InvalidParameterError` (code 1): the token is pending, the application state is invalid, the operation is duplicated, or cancellation is unavailable.
        - 400 `OperationNotAllowedStateError` (code 101): personal information is missing for either counterparty.
        - 401 `AuthorizationError` (code 1): authentication fails.
        - 404: the token or transfer-approval application is not present.
        - 422: the request or a header is invalid.
        - 503 `SendTransactionError` (code 2): a transaction cannot be sent.
      operationId: UpdateBondTokenTransferApprovalStatus
      parameters:
        - name: token_address
          in: path
          required: true
          schema:
            type: string
            title: Token Address
        - name: id
          in: path
          required: true
          schema:
            type: integer
            title: Id
        - name: issuer-address
          in: header
          required: true
          schema:
            type: string
            title: Issuer-Address
        - name: eoa-password
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Eoa-Password
        - name: auth-token
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Auth-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransferApprovalRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ContractRevertErrorResponse'
                  - $ref: '#/components/schemas/InvalidParameterErrorResponse'
                  - $ref: '#/components/schemas/OperationNotAllowedStateErrorResponse'
                title: Response 400 Updatebondtokentransferapprovalstatus
        '401':
          description: Authorization Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTransactionErrorResponse'
    get:
      tags:
