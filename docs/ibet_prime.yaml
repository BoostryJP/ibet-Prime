      description: |-
        Create an EOA account used to record freeze logs.

        Private key material is not returned.

        When `E2EE_REQUEST_ENABLED` is enabled, `eoa_password` must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the EOA password does not satisfy the configured policy.
        - 422: the request is invalid, or the encrypted password cannot be decoded.
      operationId: CreateFreezeLogAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFreezeLogAccountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeLogAccountResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /freeze_log/accounts/{account_address}:
    delete:
      tags:
        - '[misc] freeze_log'
      summary: Delete Account
      description: |-
        Logically delete a freeze-log EOA account.

        Repeating the request succeeds for an existing account and leaves it deleted.

        Errors:
        - 404: no account exists for `account_address`.
      operationId: DeleteFreezeLogAccount
      parameters:
        - name: account_address
          in: path
          required: true
          schema:
            type: string
            title: Account Address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeLogAccountResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
  /freeze_log/accounts/{account_address}/eoa_password:
    post:
      tags:
        - '[misc] freeze_log'
      summary: Change Eoa Password
      description: |-
        Change a freeze-log account's EOA password.

        The old password must match the stored password.
        The account address remains unchanged.

        When `E2EE_REQUEST_ENABLED` is enabled, both password values must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the old password does not match, or the new password does not satisfy the configured policy.
        - 404: no account exists for `account_address`.
        - 422: the request is invalid, or an encrypted password cannot be decoded.
      operationId: ChangeFreezeLogAccountPassword
      parameters:
        - name: account_address
          in: path
          required: true
          schema:
            type: string
            title: Account Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeLogAccountChangeEOAPasswordRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /freeze_log/logs:
    post:
      tags:
        - '[misc] freeze_log'
      summary: Record New Log
      description: |-
        Submit a new message to the configured freeze-log contract.

        The account password is checked, and the assigned log index is returned after submission succeeds.
        Log immutability begins after the requested grace-block count.

        `FREEZE_LOG_CONTRACT_ADDRESS` must be configured.
        When `E2EE_REQUEST_ENABLED` is enabled, `eoa_password` must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the EOA password does not match.
        - 404: no freeze-log account exists for the request address.
        - 422: the request is invalid.
        - 500: `FREEZE_LOG_CONTRACT_ADDRESS` is not configured.
        - 503 `SendTransactionError` (code 2): transaction submission fails, including a contract revert.
      operationId: RecordNewFreezeLog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordNewFreezeLogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordNewFreezeLogResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Model'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTransactionErrorResponse'
  /freeze_log/logs/{log_index}:
    post:
      tags:
        - '[misc] freeze_log'
      summary: Update Log
      description: |-
        Update a freeze-log message before its grace period expires.

        The account password is checked, and the update succeeds only while the log remains mutable.

        `FREEZE_LOG_CONTRACT_ADDRESS` must be configured.
        When `E2EE_REQUEST_ENABLED` is enabled, `eoa_password` must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the EOA password does not match.
        - 404: no freeze-log account exists for the request address.
        - 422: the request is invalid.
        - 500: `FREEZE_LOG_CONTRACT_ADDRESS` is not configured.
        - 503 `SendTransactionError` (code 2): transaction submission fails, including a contract revert or an immutable log.
      operationId: UpdateFreezeLog
      parameters:
        - name: log_index
          in: path
          required: true
          schema:
            type: integer
            description: Log index
            title: Log Index
          description: Log index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFreezeLogRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Model'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTransactionErrorResponse'
    get:
      tags:
        - '[misc] freeze_log'
      summary: Retrieve Log
      description: |-
        Retrieve a freeze-log entry from the configured contract.

        The block number, grace-block count, and message are returned.
        The query's account identifies the account used for the request, and `FREEZE_LOG_CONTRACT_ADDRESS` must be configured.

        Errors:
        - 404: no freeze-log account exists for the query address.
        - 422: the path or query is invalid.
        - 500: `FREEZE_LOG_CONTRACT_ADDRESS` is not configured.
      operationId: RetrieveFreezeLog
      parameters:
        - name: log_index
          in: path
          required: true
          schema:
            type: integer
            description: Log index
            title: Log Index
          description: Log index
        - name: account_address
          in: query
          required: true
          schema:
            type: string
            description: Logging account address
            title: Account Address
          description: Logging account address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveFreezeLogResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Model'
