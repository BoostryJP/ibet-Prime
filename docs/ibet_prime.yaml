openapi: 3.1.0
info:
  title: ibet Prime
  description: Security token management system for ibet network
  version: '26.12'
paths:
  /:
    get:
      tags:
        - root
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
  /healthcheck:
    get:
      tags:
        - common
      summary: Service Health Check
      description: |-
        Check the availability and synchronization of required services.

        Ethereum and Avalanche availability is checked only when the corresponding IbetWST features are enabled.

        Errors:
        - 503 `ServiceUnavailableError` (code 1): a required service is unavailable, a required node is not synchronized, or the E2EE key is invalid.
      operationId: ServiceHealthCheck
      responses:
        '200':
          description: Successful Response
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
  /block_number:
    get:
      tags:
        - common
      summary: Get Latest Block Number
      description: |-
        Get the latest ibet node block number.

        Errors:
        - 503 `ServiceUnavailableError` (code 1): the configured ibet node cannot provide the current block number.
      operationId: GetLatestBlockNumber
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockNumberResponse'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
  /e2ee:
    get:
      tags:
        - common
      summary: E2E Encryption Key
      description: |-
        Return the public key used to encrypt sensitive request fields.

        The endpoint returns `null` when `E2EE_REQUEST_ENABLED` is disabled.
        When enabled, clients must use the returned key to encrypt sensitive request fields.
      operationId: GetE2EEncryptionKey
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/E2EEResponse'
  /accounts:
    get:
      tags:
        - account
      summary: List All Issuers
      description: |-
        List all issuer accounts ordered by issuer address.

        Logically deleted issuers are also returned and identified by `is_deleted=true`.
        The response does not contain private keys or encrypted passwords.
      operationId: ListAllIssuers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountResponse'
                type: array
                title: Response Listallissuers
    post:
      tags:
        - account
      summary: Create Issuer Key
      description: |-
        Create an issuer account and its EOA key.

        A new Ethereum address is generated for the issuer.
        The private key is not returned.

        When `E2EE_REQUEST_ENABLED` is enabled, `eoa_password` must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the decrypted EOA password does not satisfy the configured password policy.
        - 422: the request is invalid, or the encrypted password cannot be decoded.
      operationId: CreateIssuerKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}:
    get:
      tags:
        - account
      summary: Retrieve Issuer
      description: |-
        Retrieve an issuer account, including its logical-deletion state.

        The response does not contain the EOA key file, private key, or encrypted password.

        Errors:
        - 404: no account exists for `issuer_address`.
      operationId: RetrieveIssuer
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
    delete:
      tags:
        - account
      summary: Delete Issuer
      description: |-
        Logically delete an issuer account.

        This operation sets `is_deleted=true` and keeps the account retrievable.
        Repeating the request after deletion is successful and leaves the account marked as deleted.

        Errors:
        - 404: no account exists for `issuer_address`.
      operationId: DeleteIssuer
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
  /accounts/{issuer_address}/eoa_password:
    post:
      tags:
        - account
      summary: Change Issuer Eoa Password
      description: |-
        Change an issuer's EOA password and re-encrypt its key file.

        `old_eoa_password` must match the current password.
        The Ethereum private key and issuer address remain unchanged, while subsequent authentication uses the new password.

        When `E2EE_REQUEST_ENABLED` is enabled, both password values must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the old password does not match, or the new password does not satisfy the configured password policy.
        - 404: no account exists for `issuer_address`.
        - 422: the request is invalid, or an encrypted password cannot be decoded.
      operationId: ChangeIssuerEOAPassword
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChangeEOAPasswordRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}/rsakey:
    post:
      tags:
        - account
      summary: Create Issuer Rsa Key
      description: |-
        Start generating or rotating an issuer's RSA key.

        On acceptance, `rsa_status` is set to `CREATING` for an issuer without a key, or `CHANGING` for key rotation.
        Clients should retrieve the issuer account and wait for `rsa_status` to become `SET` before using the new public key.

        If `rsa_passphrase` is omitted, the configured default passphrase is used.
        For key rotation, the previous key is retained temporarily while personal information is migrated to the replacement key.

        Errors:
        - 400 `InvalidParameterError` (code 1): generation is already in progress, or the passphrase does not satisfy the configured policy.
        - 404: no account exists for `issuer_address`.
        - 422: the request is invalid, or the encrypted passphrase cannot be decoded.
      operationId: CreateIssuerRSAKey
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountGenerateRsaKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}/rsa_passphrase:
    post:
      tags:
        - account
      summary: Change Issuer Rsa Passphrase
      description: |-
        Change the passphrase protecting an issuer's RSA private key.

        The RSA private and public key material is unchanged.
        The current RSA key must already exist, and `old_rsa_passphrase` must match it.

        When `E2EE_REQUEST_ENABLED` is enabled, both passphrase values must be encrypted with the public key returned by `/e2ee`.

        Errors:
        - 400 `InvalidParameterError` (code 1): the old passphrase does not match, or the new passphrase does not satisfy the configured policy.
        - 404: the issuer does not exist, or its RSA key/passphrase has not been generated yet.
        - 422: the request is invalid, or an encrypted passphrase cannot be decoded.
      operationId: ChangeIssuerRSAPassphrase
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChangeRSAPassphraseRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}/auth_token:
    post:
      tags:
        - account
      summary: Generate Issuer Auth Token
      description: |-
        Generate an issuer authentication token.

        When EOA password checking is enabled, the request is authenticated with `eoa-password`; another auth token cannot be used to create a replacement.
        `valid_duration` is measured in seconds, and `0` means that the token does not expire.
        The plaintext token is returned only once.

        A still-valid token cannot be replaced.
        After a finite-duration token has expired, the next request replaces it with a newly generated token.

        Errors:
        - 400 `AuthTokenAlreadyExistsError` (code 3): an existing token is still valid, including a token whose `valid_duration` is `0`.
        - 401 `AuthorizationError` (code 1): the issuer does not exist, the EOA password is incorrect, or neither required credential is valid.
        - 422: the request/header is invalid, the password is missing, or the encrypted password cannot be decoded.
      operationId: GenerateIssuerAuthToken
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: eoa-password
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Eoa-Password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAuthTokenRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAuthTokenResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenAlreadyExistsErrorResponse'
        '401':
          description: Authorization Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
    delete:
      tags:
        - account
      summary: Delete Issuer Auth Token
      description: |-
        Delete an issuer authentication token.

        Authentication can use either `eoa-password` or the token itself.
        A successful request permanently invalidates the token; an already deleted token produces 404 and is not treated as an idempotent deletion.

        Errors:
        - 401 `AuthorizationError` (code 1): the issuer does not exist or the supplied EOA password/auth token is invalid or expired.
        - 404: no auth token currently exists for the issuer.
        - 422: the supplied header or encrypted password is invalid.
      operationId: DeleteIssuerAuthToken
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: eoa-password
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Eoa-Password
        - name: auth-token
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Auth-Token
      responses:
        '200':
          description: Successful Response
        '401':
          description: Authorization Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}/child_accounts:
    post:
      tags:
        - account
      summary: Create Child Account
      description: |-
        Create one child account for an issuer.

        A new child address and the next available child-account index are assigned.
        The supplied personal information is registered for the new child account.

        Personal information is registered with `key_manager=SELF`.
        Only issuers with a public key, including issuers created in version 24.12 or later, support this operation.

        Errors:
        - 400 `OperationNotPermittedForOlderIssuers` (code 10): the issuer has no public key because it was created by an older version.
        - 400 `PersonalInfoExceedsSizeLimit` (code 11): the serialized personal information exceeds the configured message-size limit.
        - 404: no account exists for `issuer_address`.
        - 422: the request is invalid.
        - 503 `ServiceUnavailableError` (code 1): child-account creation is temporarily unavailable; retry after concurrent creation completes.
      operationId: CreateChildAccount
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateChildAccountRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildAccountResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OperationNotPermittedForOlderIssuersResponse'
                  - $ref: '#/components/schemas/PersonalInfoExceedsSizeLimitResponse'
                title: Response 400 Createchildaccount
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
    get:
      tags:
        - account
      summary: List All Child Account
      description: |-
        List child accounts for an issuer with filtering and pagination.

        The response includes each child account's off-chain personal information when available.
        `result_set.total` is the number of child accounts before filters, while `result_set.count` is the number after filters and before pagination.

        Address and name filters are partial matches.
        Results default to ascending `child_account_index` order; `sort_item` and `sort_order` can change this.

        Errors:
        - 404: no account exists for `issuer_address`.
        - 422: a query parameter is invalid.
      operationId: ListAllChildAccount
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: offset
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            description: Offset for pagination
            title: Offset
          description: Offset for pagination
        - name: limit
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            description: Limit for pagination
            title: Limit
          description: Limit for pagination
        - name: child_account_address
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Child account address (partial match)
            title: Child Account Address
          description: Child account address (partial match)
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Child account name (partial match)
            title: Name
          description: Child account name (partial match)
        - name: created_from
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Personal information created datetime (From)
            title: Created From
          description: Personal information created datetime (From)
        - name: created_to
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Personal information created datetime (To)
            title: Created To
          description: Personal information created datetime (To)
        - name: modified_from
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Personal information modified datetime (From)
            title: Modified From
          description: Personal information modified datetime (From)
        - name: modified_to
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Personal information modified datetime (To)
            title: Modified To
          description: Personal information modified datetime (To)
        - name: sort_item
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/ListAllChildAccountSortItem'
              - type: 'null'
            description: Sort item
            default: child_account_index
            title: Sort Item
          description: Sort item
        - name: sort_order
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/SortOrder'
              - type: 'null'
            description: 'Sort order (0: ASC, 1: DESC)'
            default: 0
            title: Sort Order
          description: 'Sort order (0: ASC, 1: DESC)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllChildAccountResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
  /accounts/{issuer_address}/child_accounts/batch:
    post:
      tags:
        - account
      summary: Create Child Account In Batch
      description: |-
        Accept a batch of child accounts for asynchronous creation.

        Every submitted personal-information entry is validated before the batch is accepted.
        A successful response means that the entries were accepted; it does not mean child-account creation has completed.
        Clients can poll `GET /accounts/{issuer_address}/child_accounts` and use the returned indexes to confirm completion.

        Only issuers with a public key support this operation.
        Indexes for a batch are contiguous and remain reserved even if subsequent creation fails.

        Errors:
        - 400 `OperationNotPermittedForOlderIssuers` (code 10): the issuer has no public key because it was created by an older version.
        - 400 `BatchPersonalInfoRegistrationValidationError` (code 12): one or more entries exceed the personal-information size limit, and `detail` contains each zero-based `row_num` and its `error_reason`.
        - 404: no account exists for `issuer_address`.
        - 422: the request body is invalid.
        - 503 `ServiceUnavailableError` (code 1): child-account creation is temporarily unavailable; retry after concurrent creation completes.
      operationId: CreateChildAccountInBatch
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateChildAccountRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateChildAccountResponse'
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/BatchPersonalInfoRegistrationValidationErrorResponse'
                  - $ref: '#/components/schemas/OperationNotPermittedForOlderIssuersResponse'
                title: Response 400 Createchildaccountinbatch
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
        '503':
          description: Service Unavailable Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
  /accounts/{issuer_address}/child_accounts/{child_account_index}:
    get:
      tags:
        - account
      summary: Retrieve Child Account
      description: |-
        Retrieve one child account by issuer and child-account index.

        Off-chain personal information and its creation/modification timestamps are included when available; otherwise those fields are `null`.

        Errors:
        - 404: the issuer or child account does not exist.
        - 422: `child_account_index` is not an integer.
      operationId: RetrieveChildAccount
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: child_account_index
          in: path
          required: true
          schema:
            type: integer
            title: Child Account Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildAccountResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
    post:
      tags:
        - account
      summary: Update Child Account
      description: |-
        Replace the off-chain personal information of a child account.

        The submitted information is saved with `key_manager=SELF`.
        The change is reflected in the child's personal-information history.
        The child-account address and index do not change.

        If the child account exists but has no off-chain personal information, the request completes successfully without changing data.
        Use the retrieve endpoint to verify the resulting representation.

        Errors:
        - 400 `PersonalInfoExceedsSizeLimit` (code 11): the serialized personal information exceeds the configured message-size limit.
        - 404: the issuer or child account does not exist.
        - 422: the request body or `child_account_index` is invalid.
      operationId: UpdateChildAccount
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: child_account_index
          in: path
          required: true
          schema:
            type: integer
            title: Child Account Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateChildAccountRequest'
      responses:
        '200':
          description: Successful Response
        '400':
          description: Invalid Parameter Error / Send Transaction Error /
            Contract Revert Error etc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalInfoExceedsSizeLimitResponse'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Model'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Model'
    delete:
      tags:
        - account
      summary: Delete Child Account
      description: |-
        Delete a child account and its off-chain personal information.

        The child account and its current off-chain personal information are no longer retrievable through this API.
        Existing personal-information history is not deleted, and the child-account index is not reused.

        Errors:
        - 404: the issuer or child account does not exist.
        - 422: `child_account_index` is not an integer.
      operationId: DeleteChildAccount
      parameters:
        - name: issuer_address
          in: path
          required: true
          schema:
            type: string
            title: Issuer Address
        - name: child_account_index
          in: path
          required: true
          schema:
            type: integer
            title: Child Account Index
      responses:
